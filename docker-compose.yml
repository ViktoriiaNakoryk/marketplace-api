name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: marketplace
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=admin-bootstrap-only psql -h 127.0.0.1 -p 6432 -U admin -d marketplace -tAc 'SELECT 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite3
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
