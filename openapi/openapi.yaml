openapi: 3.0.3
servers:
  - url: http://localhost:3000
info:
  title: Marketplace API
  version: 1.0.0
security: [ ]
paths:
  /products:
    get:
      operationId: getAllProducts
      summary: Get your all products
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque pagination token from the previous response's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: Your all products are here
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: string
                    nullable: true
        '404':
          description: There is something wrong with your products
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get your product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The product is found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: The current product is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    get:
      operationId: getAllOrders
      summary: Get your all orders
      responses:
        '200':
          description: Your all orders are here
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: string
                    nullable: true
        '404':
          description: There is something wrong with your orders
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      summary: Create a new order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Key that is generated by client to avoid double same requests
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyerId, items]
              properties:
                buyerId:
                  type: integer
                  minimum: 1
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: integer
                        minimum: 1
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: The order is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get your order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The order is found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: The current order is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/status:
    patch:
      operationId: changeOrderStatus
      summary: Change the order status and notify subscribers (WebSocket room orders:{id} + SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, paid, shipped, completed, cancelled, refunded]
      responses:
        '200':
          description: The status is changed; the published event is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusEvent'
        '400':
          description: Unknown status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The current order is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/events:
    get:
      operationId: streamOrderEvents
      summary: Server-Sent Events stream of order status changes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Last-Event-ID
          in: header
          required: false
          description: Replay buffered events with id greater than this value
          schema:
            type: integer
      responses:
        '200':
          description: "Event stream: `id: <n>`, `event: order.status`, `data: <OrderStatusEvent JSON>`"
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: The current order is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    OrderStatusEvent:
      type: object
      required: [id, orderId, status, previousStatus, changedAt]
      properties:
        id:
          type: integer
          description: Номер події в межах замовлення, зростає
        orderId:
          type: integer
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled, refunded]
        previousStatus:
          type: string
          enum: [pending, paid, shipped, completed, cancelled, refunded]
        changedAt:
          type: string
          format: date-time
    Product:
      type: object
      required: [id, sellerId, sku, name, description, category, brand, price, stock]
      properties:
        id:
          type: integer
        sellerId:
          type: integer
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        brand:
          type: string
        price:
          type: integer
          description: Ціна в мінорних одиницях (копійках)
        stock:
          type: integer
    Order:
      type: object
      required: [id, buyerId, status, total, createdAt, items]
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled, refunded]
        total:
          type: integer
          description: Сума в мінорних одиницях (копійках)
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [productId, name, quantity, unitPrice]
            properties:
              productId:
                type: integer
              name:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: integer
    Problem:
      type: object
      required: [ type, title, status, detail, instance ]
      properties:
        type:
          type: string
          description: URI типу помилки
        title:
          type: string
          description: Коротка назва помилки
        status:
          type: integer
          description: HTTP-код
        detail:
          type: string
          description: Що саме пішло не так
        instance:
          type: string
          description: Посилання на конкретний випадок